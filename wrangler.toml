# Cloudflare Pages project config. Build: `npm run build`, output: `out`.
name = "codifykit"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Model used by Kitto. Override in the Pages dashboard if you want a different one.
KITTO_MODEL = "claude-opus-5-5"
# ANTHROPIC_API_KEY is a secret: set it with
#   npx wrangler pages secret put ANTHROPIC_API_KEY --project-name codifykit
